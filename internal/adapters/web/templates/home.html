<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Personal KB</a>
    <nav class="nav" aria-label="Main">
      <a href="/healthz">Health</a>
    </nav>
  </header>

  <main class="shell">
    <section class="input-surface" aria-labelledby="page-title">
      <div class="section-head">
        <p class="eyebrow">Local memory core</p>
        <h1 id="page-title">Personal KB</h1>
      </div>

      <form class="message-form">
        <textarea name="text" placeholder="Write a note, task, link, or thought..." disabled></textarea>
        <div class="form-row">
          <button type="button" disabled>Submit</button>
          <span class="muted">Input pipeline arrives in stage 3.</span>
        </div>
      </form>
    </section>

    <section class="input-surface" aria-labelledby="topics-title">
      <div class="section-head">
        <p class="eyebrow">Topics</p>
        <h2 id="topics-title">Create topic</h2>
      </div>

      <form class="topic-form" action="/topics" method="post">
        <label>
          <span>Topic name</span>
          <input name="name" type="text" required>
        </label>
        <label>
          <span>Description</span>
          <textarea class="compact-textarea" name="description"></textarea>
        </label>
        <div class="form-row">
          <button type="submit">Create topic</button>
        </div>
      </form>

      <div class="topics-panel" aria-labelledby="topics-list-title">
        <div class="topics-head">
          <h3 id="topics-list-title">All topics</h3>
          <div class="topics-actions">
            <span class="muted" data-topics-count>{{len .Topics}} total</span>
            <button class="secondary-button" type="button" data-show-topics>Show all topics</button>
          </div>
        </div>
        <p class="topics-status" data-topics-status aria-live="polite"></p>

        <ul class="topics-list" data-topics-list>
          {{range .Topics}}
            <li class="topic-row">
              <div class="topic-meta">
                <strong>{{.Name}}</strong>
                <span>{{.Slug}}</span>
                <form class="topic-description-form" action="/topics/{{.Slug}}/description" data-topic-description-form>
                  <textarea class="compact-textarea" name="description" aria-label="Description for {{.Name}}">{{.Description}}</textarea>
                  <button class="secondary-button" type="submit">Save description</button>
                </form>
              </div>
              <button class="danger-button" type="button" data-delete-topic data-delete-url="/topics/{{.Slug}}">Delete</button>
            </li>
          {{end}}
        </ul>
        <p class="empty-state" data-topics-empty {{if .Topics}}hidden{{end}}>No topics yet.</p>
      </div>
    </section>

    <section class="status-grid" aria-label="Application status">
      <div class="status-item">
        <span>Server</span>
        <strong>running</strong>
      </div>
      <div class="status-item">
        <span>Started</span>
        <strong>{{.StartedAt}}</strong>
      </div>
    </section>
  </main>
  <script src="/static/topics.js" defer></script>
</body>
</html>
